<!DOCTYPE html>
<html>
<head>
    <title>🚀 SpaceCraftEnv</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>🚀 SpaceCraft Environment</h1>

<div class="container">

    <div class="controls">
        <button onclick="resetEnv()">Reset</button>

        <h3>Action</h3>
        <label>Thrust:</label>
        <input type="number" id="thrust" value="1.0" step="0.1">

        <label>Rotate:</label>
        <input type="number" id="rotate" value="0.0" step="0.1">

        <button onclick="stepEnv()">Step</button>
    </div>

    <div class="output">
        <h3>State</h3>
        <pre id="state"></pre>

        <h3>Reward</h3>
        <pre id="reward"></pre>

        <h3>Status</h3>
        <pre id="done"></pre>
    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
